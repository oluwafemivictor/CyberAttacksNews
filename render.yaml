services:
  - type: web
    name: cyberattacksnews
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: JWT_SECRET
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: cyberattacksnews
          property: connectionString

databases:
  - name: cyberattacksnews
    plan: free
    postgresMajorVersion: "16"
    databaseName: cyberattacksnews
    user: cyberattacksnews
